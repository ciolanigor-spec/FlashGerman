<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>FlashGerman</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root{--bg:#0b1329;--surface:#1e293b;--text:#f8fafc;--muted:#94a3b8;--blue:#38bdf8;--border:#334155;--again:#ef4444;--learn:#f59e0b;--know:#10b981}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{touch-action:manipulation}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}.app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}header,.card-header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:1.25rem;font-weight:800;color:var(--blue)}select,button,input{font:inherit;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:7px 12px;cursor:pointer}.profile{display:flex;gap:8px}.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:10px}.tab{flex:1;border:0;color:var(--muted)}.tab.active{background:var(--blue);color:#0f172a}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;padding:0 4px}.card-wrap{perspective:1000px;height:380px}.card{height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s;cursor:pointer}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 25px -5px #0005}.back{transform:rotateY(180deg)}.badge{font-size:.75rem;padding:4px 8px;border-radius:6px;background:#334155;color:var(--muted)}.level{background:#1e3a8a;color:var(--blue);font-weight:600}.body{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.word{font-size:2.25rem;font-weight:700}.translation{font-size:1.35rem;color:var(--blue);font-weight:600}.dwds{font-size:1rem;color:#e2e8f0;white-space:pre-wrap}.example{font-size:.95rem;color:var(--muted);font-style:italic;white-space:pre-wrap}.footer{text-align:center;font-size:.75rem;color:var(--muted)}.actions,.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.nav{grid-template-columns:1fr 1fr;margin-top:10px}.action{border:0;color:#fff;font-weight:700;padding:14px 8px}.again{background:var(--again)}.learning{background:var(--learn)}.know{background:var(--know)}.directory{display:none;flex-direction:column;gap:8px;max-height:500px;overflow-y:auto}.directory-item{background:var(--surface);padding:12px;border-radius:8px;display:flex;justify-content:space-between;gap:8px}.muted{font-size:.8rem;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:2}.modal-box{background:var(--surface);padding:20px;border-radius:12px;width:90%;max-width:360px;display:flex;flex-direction:column;gap:12px}
  </style>
</head>
<body><div class="app">
  <header><div class="brand">FlashGerman</div><div class="profile"><select id="profileSelect" onchange="switchProfile(this.value)"></select><button onclick="openProfileModal()">⚙️</button></div></header>
  <div class="tabs"><button class="tab active" id="tabPractice" onclick="setTab('practice')">Practice</button><button class="tab" id="tabDirectory" onclick="setTab('directory')">Word Directory</button></div>
  <main id="practiceView"><div class="stats"><span>Queue: <strong id="queueCount">0</strong> remaining</span><span>Known: <strong id="knownCount">0</strong></span></div><div class="card-wrap"><div class="card" id="card" onclick="flipCard()"><div class="face front"><div class="card-header"><span class="badge" id="cardRank"></span><span class="badge level" id="cardLevel"></span></div><div class="body"><div class="word" id="frontWord">...</div><button onclick="event.stopPropagation();speakCurrentWord()">🔊</button></div><div class="footer">Tap to flip 🔄</div></div><div class="face back"><div class="card-header"><span class="badge" id="backRank"></span><span class="badge level" id="backLevel"></span></div><div class="body"><div class="translation" id="backTranslation">...</div><div class="dwds" id="backDwds"></div><div class="example" id="backExample"></div></div><div class="footer">Select status below</div></div></div></div><div class="actions"><button class="action again" onclick="rateCard('again')">Again</button><button class="action learning" onclick="rateCard('learning')">Learning</button><button class="action know" onclick="rateCard('know')">Know</button></div><div class="nav"><button onclick="prevCard()">← Previous Card</button><button onclick="nextCard()">Next Card →</button></div></main>
  <section id="directoryView" class="directory"><input id="dirSearch" placeholder="Search words..." oninput="renderDirectory()"><div id="directoryList"></div></section>
</div><div class="modal" id="profileModal"><div class="modal-box"><h3>Manage Profiles</h3><input id="newProfileName" placeholder="New Profile Name"><button onclick="createProfile()">Add Profile</button><button class="again" onclick="resetCurrentProfileProgress()">Reset Progress</button><button onclick="closeProfileModal()">Close</button></div></div>
<script>
const CSV_URL='https://raw.githubusercontent.com/ciolanigor-spec/FlashGerman/main/german_vocabulary_top20000.csv';let vocabulary=[],activeQueue=[],currentIndex=0,profiles=JSON.parse(localStorage.getItem('fg_profiles'))||['Profile 1'],currentProfile=localStorage.getItem('fg_current_profile')||'Profile 1',userProgress={};
window.addEventListener('DOMContentLoaded',()=>{loadProfiles();loadUserProgress();Papa.parse(CSV_URL,{download:true,header:true,skipEmptyLines:true,complete:r=>{vocabulary=r.data;buildQueue();renderCard()}})});
function loadProfiles(){profileSelect.innerHTML='';profiles.forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;o.selected=p===currentProfile;profileSelect.appendChild(o)})}function switchProfile(n){currentProfile=n;localStorage.setItem('fg_current_profile',n);loadUserProgress();buildQueue();currentIndex=0;renderCard()}function loadUserProgress(){let d=localStorage.getItem('fg_progress_'+currentProfile);userProgress=d?JSON.parse(d):{}}function saveUserProgress(){localStorage.setItem('fg_progress_'+currentProfile,JSON.stringify(userProgress))}function buildQueue(){activeQueue=vocabulary.filter(i=>userProgress[i.Wort]!=='know');updateStats()}function updateStats(){queueCount.textContent=activeQueue.length;knownCount.textContent=Object.values(userProgress).filter(v=>v==='know').length}
function renderCard(){card.classList.remove('flipped');if(!activeQueue.length){frontWord.textContent='All Done! 🎉';cardRank.textContent='-';backTranslation.textContent='';backDwds.textContent='';backExample.textContent='';return}if(currentIndex>=activeQueue.length)currentIndex=0;if(currentIndex<0)currentIndex=activeQueue.length-1;let i=activeQueue[currentIndex],rank=i.Rank||(currentIndex+1),level=i.Sprachniveau_Est||'A1-B1';frontWord.textContent=i.Wort||'—';cardRank.textContent='Rank #'+rank;cardLevel.textContent=level;backTranslation.textContent=i.Erklärung||'Keine Erklärung verfügbar';backDwds.textContent=i.DWDS_Erklärung?'DWDS: '+i.DWDS_Erklärung:'';backExample.textContent=i.Synonyme?'Synonyme: '+i.Synonyme:'';backRank.textContent='Rank #'+rank;backLevel.textContent=level}
function flipCard(){card.classList.toggle('flipped')}function rateCard(s){if(!activeQueue.length)return;userProgress[activeQueue[currentIndex].Wort]=s;saveUserProgress();if(s==='know')activeQueue.splice(currentIndex,1);else currentIndex++;updateStats();renderCard()}function nextCard(){currentIndex++;renderCard()}function prevCard(){currentIndex--;renderCard()}function speakCurrentWord(){if(!activeQueue.length||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(activeQueue[currentIndex].Wort);u.lang='de-DE';u.rate=.9;speechSynthesis.speak(u)}
function setTab(t){tabPractice.classList.toggle('active',t==='practice');tabDirectory.classList.toggle('active',t==='directory');practiceView.style.display=t==='practice'?'block':'none';directoryView.style.display=t==='directory'?'flex':'none';if(t==='directory')renderDirectory()}function renderDirectory(){let f=dirSearch.value.toLowerCase();directoryList.innerHTML='';vocabulary.filter(i=>(i.Wort||'').toLowerCase().includes(f)).slice(0,50).forEach(i=>{let d=document.createElement('div');d.className='directory-item';let e=i.DWDS_Erklärung?`<div class="muted">DWDS: ${i.DWDS_Erklärung}</div>`:'';d.innerHTML=`<div><strong>${i.Wort}</strong> <small>(${i.Wortart||''})</small><div class="muted">${i.Erklärung||''}</div>${e}</div><span class="badge">${userProgress[i.Wort]||'unseen'}</span>`;directoryList.appendChild(d)})}function openProfileModal(){profileModal.style.display='flex'}function closeProfileModal(){profileModal.style.display='none'}function createProfile(){let n=newProfileName.value.trim();if(n&&!profiles.includes(n)){profiles.push(n);localStorage.setItem('fg_profiles',JSON.stringify(profiles));loadProfiles();switchProfile(n);closeProfileModal()}}function resetCurrentProfileProgress(){if(confirm('Reset all progress for '+currentProfile+'?')){userProgress={};saveUserProgress();buildQueue();renderCard();closeProfileModal()}}
</script></body></html>
