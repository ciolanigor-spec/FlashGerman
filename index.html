<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlashGerman</title>
  
  <!-- iPhone PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlashGerman">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197571.png">

  <!-- PapaParse library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --red: #ef4444;
      --yellow: #f59e0b;
      --green: #10b981;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)) 16px;
    }

    .app-container {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0 auto;
    }

    /* Top Navigation Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .brand {
      font-weight: 800;
      font-size: 20px;
      color: var(--accent);
    }

    .profile-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .profile-select {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Navigation Tabs */
    .tabs-bar {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: none;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    /* Stats Header */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    /* Practice View Layout */
    #practiceView {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Card Container */
    .card-container {
      width: 100%;
      height: 380px;
      perspective: 1000px;
      position: relative;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    /* Front Side */
    .card-front {
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .badge-container {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      background: var(--border);
      color: var(--text-main);
    }

    .badge-level { background: #0284c7; }

    .word-front-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .word-main {
      font-size: 38px;
      font-weight: 800;
      text-align: center;
      color: #fff;
    }

    .btn-audio {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.1s;
      flex-shrink: 0;
    }

    .btn-audio:active {
      transform: scale(0.9);
    }

    .tap-hint {
      position: absolute;
      bottom: 16px;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* Back Side */
    .card-back {
      transform: rotateY(180deg);
      overflow-y: auto;
    }

    .word-header-back {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .word-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
    }

    .pos-tag {
      font-size: 14px;
      color: var(--text-sub);
      font-style: italic;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-top: 12px;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .explanation-text {
      font-size: 15px;
      line-height: 1.5;
      color: #e2e8f0;
      font-weight: 500;
    }

    .dwds-box {
      display: none;
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.4;
      color: #cbd5e1;
      border: 1px solid var(--border);
    }

    .toggle-dwds {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 13px;
      padding: 0;
      margin-top: 8px;
      cursor: pointer;
      text-decoration: underline;
    }

    .synonyms-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .synonym-chip {
      background: var(--border);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #e2e8f0;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .btn {
      padding: 14px 8px;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-again { background: var(--red); }
    .btn-learn { background: var(--yellow); color: #0f172a; }
    .btn-know { background: var(--green); }

    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-nav {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    .modal-input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Directory View */
    .directory-view {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .chip-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .word-list {
      max-height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-item-word {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }

    .list-item-sub {
      font-size: 12px;
      color: var(--text-sub);
    }

    .status-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-know { background: rgba(16, 185, 129, 0.2); color: var(--green); }
    .status-learn { background: rgba(245, 158, 11, 0.2); color: var(--yellow); }
    .status-again { background: rgba(239, 68, 68, 0.2); color: var(--red); }
    .status-unseen { background: rgba(148, 163, 184, 0.1); color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <span class="brand">FlashGerman</span>
      <div class="profile-controls">
        <select id="profileSelect" class="profile-select" onchange="switchProfile()"></select>
        <button class="btn-icon" onclick="openProfileModal()">⚙️ Profiles</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" id="tabPractice" onclick="switchTab('practice')">Practice</button>
      <button class="tab-btn" id="tabDirectory" onclick="switchTab('directory')">Word Directory</button>
    </div>

    <!-- Practice Panel -->
    <div id="practiceView">
      <div>
        <div class="stats-bar">
          <span>Queue: <strong id="queueCount">0</strong> remaining</span>
          <span style="color: var(--green);">Known: <strong id="knownCount">0</strong></span>
        </div>
        <div class="progress-container">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="card-container">
        <div class="card" id="card" onclick="flipCard()">
          <!-- Front Side -->
          <div class="card-face card-front">
            <div class="badge-container">
              <span class="badge" id="rankBadge">Rank #-</span>
              <span class="badge badge-level" id="levelBadge">-</span>
            </div>

            <div class="word-front-wrapper">
              <div class="word-main" id="wordFront">Loading...</div>
              <button class="btn-audio" title="Listen" onclick="speakCurrentWord(event)">🔊</button>
            </div>

            <div class="tap-hint">Tap to flip ↺</div>
          </div>

          <!-- Back Side -->
          <div class="card-face card-back">
            <div>
              <div class="word-header-back">
                <div>
                  <div class="word-title" id="wordBack">-</div>
                  <div class="pos-tag" id="wortart">-</div>
                </div>
                <button class="btn-audio" title="Listen" onclick="speakCurrentWord(event)">🔊</button>
              </div>

              <div class="section-title">Explanation</div>
              <div class="explanation-text" id="erklaerung">-</div>

              <div id="dwdsContainer" style="display: none;">
                <button class="toggle-dwds" id="dwdsBtn" onclick="toggleDWDS(event)">Show DWDS Definition</button>
                <div class="dwds-box" id="dwdsText"></div>
              </div>

              <div class="section-title">Synonyms</div>
              <div class="synonyms-container" id="synonymsContainer">
                <span class="synonym-chip">-</span>
              </div>
            </div>
            
            <div class="tap-hint" style="position: relative; text-align: center; margin-top: 16px;">Tap to flip ↺</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="action-row">
          <button class="btn btn-again" onclick="markWord('again')">
            <span>🔴</span>
            <span>Again</span>
          </button>
          <button class="btn btn-learn" onclick="markWord('learn')">
            <span>🟡</span>
            <span>Learning</span>
          </button>
          <button class="btn btn-know" onclick="markWord('know')">
            <span>🟢</span>
            <span>Know</span>
          </button>
        </div>

        <div class="nav-row">
          <button class="btn-nav" onclick="prevCard()">← Previous Card</button>
          <button class="btn-nav" onclick="nextCard()">Next Card →</button>
        </div>
      </div>
    </div>

    <!-- Word Directory Panel -->
    <div id="directoryView" class="directory-view">
      <input type="text" id="searchInput" class="search-input" placeholder="Search word or definition..." oninput="renderWordDirectory()">
      <div class="filter-chips">
        <button class="chip-btn active" onclick="setDirectoryFilter('all', this)">All</button>
        <button class="chip-btn" onclick="setDirectoryFilter('know', this)">Known</button>
        <button class="chip-btn" onclick="setDirectoryFilter('learn', this)">Learning</button>
        <button class="chip-btn" onclick="setDirectoryFilter('again', this)">Again</button>
        <button class="chip-btn" onclick="setDirectoryFilter('unseen', this)">Unseen</button>
      </div>

      <div class="word-list" id="wordListContainer"></div>
    </div>
  </div>

  <!-- Profile Settings Modal -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal">
      <div class="modal-title">Manage Profiles</div>
      <input type="text" id="newProfileInput" class="modal-input" placeholder="New Profile Name">
      
      <div style="display: flex; gap: 8px;">
        <button class="btn-nav" style="background: var(--accent); color: #000;" onclick="createProfile()">Add Profile</button>
        <button class="btn-nav" onclick="renameCurrentProfile()">Rename Active</button>
      </div>

      <hr style="border-color: var(--border);">

      <button class="btn-nav" style="background: var(--red); color: #fff;" onclick="resetCurrentProfileProgress()">⚠️ Reset Current Progress</button>
      <button class="btn-nav" style="color: var(--red);" onclick="deleteCurrentProfile()">Delete Active Profile</button>
      
      <div class="modal-actions">
        <button class="btn-nav" onclick="closeProfileModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://raw.githubusercontent.com/ciolanigor-spec/FlashGerman/main/german_vocabulary_top20000.csv';

    let rawWords = [];
    let activeQueue = [];
    let currentQueueIndex = 0;
    
    let profiles = JSON.parse(localStorage.getItem('fg_profiles_list') || '["Profile 1", "Profile 2"]');
    let activeProfile = localStorage.getItem('fg_active_profile_name') || profiles[0];
    let userProgress = {};
    let directoryFilter = 'all';

    window.onload = () => {
      syncProfileSelector();
      loadProgress();
      fetchCSVData();
    };

    /* Speech Synthesis Function */
    function speakCurrentWord(event) {
      if (event) event.stopPropagation();
      const currentWordObj = activeQueue[currentQueueIndex];
      if (!currentWordObj || !currentWordObj.Wort) return;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(currentWordObj.Wort);
        utterance.lang = 'de-DE';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      } else {
        alert('Text-to-speech is not supported on this browser.');
      }
    }

    function syncProfileSelector() {
      const select = document.getElementById('profileSelect');
      select.innerHTML = '';
      profiles.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.innerText = p;
        if (p === activeProfile) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchProfile() {
      activeProfile = document.getElementById('profileSelect').value;
      localStorage.setItem('fg_active_profile_name', activeProfile);
      loadProgress();
      buildActiveQueue();
      updateUI();
    }

    function loadProgress() {
      userProgress = JSON.parse(localStorage.getItem(`fg_progress_${activeProfile}`) || '{}');
    }

    function saveProgress() {
      localStorage.setItem(`fg_progress_${activeProfile}`, JSON.stringify(userProgress));
      localStorage.setItem('fg_profiles_list', JSON.stringify(profiles));
    }

    function openProfileModal() {
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function createProfile() {
      const name = document.getElementById('newProfileInput').value.trim();
      if (!name) return;
      if (!profiles.includes(name)) {
        profiles.push(name);
        activeProfile = name;
        saveProgress();
        syncProfileSelector();
        switchProfile();
      }
      document.getElementById('newProfileInput').value = '';
      closeProfileModal();
    }

    function renameCurrentProfile() {
      const newName = prompt('Enter new name for ' + activeProfile + ':', activeProfile);
      if (newName && newName.trim() && newName !== activeProfile) {
        const index = profiles.indexOf(activeProfile);
        if (index !== -1) {
          const oldName = activeProfile;
          profiles[index] = newName.trim();
          activeProfile = newName.trim();
          
          const oldData = localStorage.getItem(`fg_progress_${oldName}`);
          if (oldData) {
            localStorage.setItem(`fg_progress_${activeProfile}`, oldData);
            localStorage.removeItem(`fg_progress_${oldName}`);
          }
          saveProgress();
          syncProfileSelector();
          switchProfile();
        }
      }
      closeProfileModal();
    }

    function deleteCurrentProfile() {
      if (profiles.length <= 1) {
        alert('You must have at least one profile.');
        return;
      }
      if (confirm(`Delete profile "${activeProfile}"? All history will be removed.`)) {
        localStorage.removeItem(`fg_progress_${activeProfile}`);
        profiles = profiles.filter(p => p !== activeProfile);
        activeProfile = profiles[0];
        saveProgress();
        syncProfileSelector();
        switchProfile();
        closeProfileModal();
      }
    }

    function resetCurrentProfileProgress() {
      if (confirm(`Reset all progress for profile "${activeProfile}"?`)) {
        userProgress = {};
        saveProgress();
        buildActiveQueue();
        updateUI();
        closeProfileModal();
      }
    }

    function switchTab(tab) {
      document.getElementById('tabPractice').classList.toggle('active', tab === 'practice');
      document.getElementById('tabDirectory').classList.toggle('active', tab === 'directory');

      document.getElementById('practiceView').style.display = tab === 'practice' ? 'flex' : 'none';
      document.getElementById('directoryView').style.display = tab === 'directory' ? 'flex' : 'none';

      if (tab === 'directory') renderWordDirectory();
    }

    function fetchCSVData() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          rawWords = results.data;
          buildActiveQueue();
          updateUI();
        }
      });
    }

    function buildActiveQueue() {
      if (!rawWords.length) return;

      const unstudiedOrLearning = rawWords.filter(item => userProgress[item.Wort] !== 'know');
      
      unstudiedOrLearning.sort((a, b) => {
        const priority = { 'again': 1, 'learn': 2, 'unseen': 3 };
        const statusA = userProgress[a.Wort] || 'unseen';
        const statusB = userProgress[b.Wort] || 'unseen';
        return (priority[statusA] || 3) - (priority[statusB] || 3);
      });

      activeQueue = unstudiedOrLearning;
      currentQueueIndex = 0;
    }

    function updateUI() {
      if (!activeQueue.length) return;

      const card = document.getElementById('card');
      card.classList.remove('flipped');

      const word = activeQueue[currentQueueIndex];

      document.getElementById('wordFront').innerText = word.Wort || '';
      document.getElementById('rankBadge').innerText = `Rank #${word.Rank || '-'}`;
      document.getElementById('levelBadge').innerText = word.Sprachniveau_Est || 'A1-B1';

      document.getElementById('wordBack').innerText = word.Wort || '';
      document.getElementById('wortart').innerText = word.Wortart || '';
      document.getElementById('erklaerung').innerText = word.Erklärung || 'No definition available.';

      const dwdsBox = document.getElementById('dwdsText');
      const dwdsContainer = document.getElementById('dwdsContainer');
      const dwdsVal = word.DWDS_Erklärung || word['DWDS_Erklärung'];

      if (dwdsVal && dwdsVal.trim() !== '') {
        dwdsBox.innerText = dwdsVal;
        dwdsContainer.style.display = 'block';
        dwdsBox.style.display = 'none';
        document.getElementById('dwdsBtn').innerText = 'Show DWDS Definition';
      } else {
        dwdsContainer.style.display = 'none';
      }

      const synContainer = document.getElementById('synonymsContainer');
      synContainer.innerHTML = '';
      if (word.Synonyme && word.Synonyme.trim() !== '') {
        word.Synonyme.split(',').forEach(syn => {
          const chip = document.createElement('span');
          chip.className = 'synonym-chip';
          chip.innerText = syn.trim();
          synContainer.appendChild(chip);
        });
      } else {
        synContainer.innerHTML = '<span class="synonym-chip" style="opacity:0.5;">No synonyms</span>';
      }

      updateStats();
    }

    function updateStats() {
      const knownTotal = Object.values(userProgress).filter(v => v === 'know').length;
      document.getElementById('queueCount').innerText = activeQueue.length;
      document.getElementById('knownCount').innerText = knownTotal;

      const progressPercent = (knownTotal / (rawWords.length || 1)) * 100;
      document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function toggleDWDS(event) {
      event.stopPropagation();
      const dwdsBox = document.getElementById('dwdsText');
      const btn = document.getElementById('dwdsBtn');

      if (dwdsBox.style.display === 'none') {
        dwdsBox.style.display = 'block';
        btn.innerText = 'Hide DWDS Definition';
      } else {
        dwdsBox.style.display = 'none';
        btn.innerText = 'Show DWDS Definition';
      }
    }

    function markWord(status) {
      const currentWordObj = activeQueue[currentQueueIndex];
      if (!currentWordObj) return;

      userProgress[currentWordObj.Wort] = status;
      saveProgress();

      if (status === 'know') {
        activeQueue.splice(currentQueueIndex, 1);
      } else {
        const reorderItem = activeQueue.splice(currentQueueIndex, 1)[0];
        const nextTargetIndex = Math.min(currentQueueIndex + 4, activeQueue.length);
        activeQueue.splice(nextTargetIndex, 0, reorderItem);
      }

      if (currentQueueIndex >= activeQueue.length) currentQueueIndex = 0;
      updateUI();
    }

    function prevCard() {
      if (currentQueueIndex > 0) {
        currentQueueIndex--;
        updateUI();
      }
    }

    function nextCard() {
      if (currentQueueIndex < activeQueue.length - 1) {
        currentQueueIndex++;
        updateUI();
      }
    }

    function setDirectoryFilter(filter, btn) {
      directoryFilter = filter;
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderWordDirectory();
    }

    function renderWordDirectory() {
      const container = document.getElementById('wordListContainer');
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      const filtered = rawWords.filter(item => {
        const status = userProgress[item.Wort] || 'unseen';
        const matchesFilter = (directoryFilter === 'all') || (status === directoryFilter);
        const matchesSearch = item.Wort.toLowerCase().includes(query) || (item.Erklärung && item.Erklärung.toLowerCase().includes(query));
        return matchesFilter && matchesSearch;
      });

      if (!filtered.length) {
        container.innerHTML = '<div style="text-align:center; color: var(--text-sub); padding: 20px;">No words found</div>';
        return;
      }

      filtered.slice(0, 100).forEach(item => {
        const status = userProgress[item.Wort] || 'unseen';
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div>
            <div class="list-item-word">${item.Wort}</div>
            <div class="list-item-sub">Rank #${item.Rank || '-'} • ${item.Wortart || ''}</div>
          </div>
          <span class="status-badge status-${status}">${status}</span>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
