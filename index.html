<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>FlashGerman</title>
  
  <!-- PapaParse for parsing remote CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-color: #0b1329;
      --surface-color: #1e293b;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --btn-again: #ef4444;
      --btn-learn: #f59e0b;
      --btn-know: #10b981;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      
      /* Respect iOS Safe Areas (notches, dynamic islands, status bar) */
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-blue);
      letter-spacing: -0.02em;
    }

    .profile-controls {
      display: flex;
      gap: 8px;
    }

    select, button {
      font-family: inherit;
      font-size: 0.875rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-main);
      padding: 6px 12px;
      cursor: pointer;
    }

    .nav-tabs {
      display: flex;
      background: var(--surface-color);
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 6px;
    }

    .tab-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    /* Card Perspective & Container */
    .flashcard-container {
      perspective: 1000px;
      width: 100%;
      height: 380px;
      margin-top: 4px;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: #334155;
      color: var(--text-muted);
    }

    .badge-level {
      background: #1e3a8a;
      color: var(--accent-blue);
      font-weight: 600;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }

    .word-main {
      font-size: 2.25rem;
      font-weight: 700;
    }

    .audio-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-blue);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
    }

    .word-row {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .translation {
      font-size: 1.5rem;
      color: var(--accent-blue);
      font-weight: 600;
    }

    .example-sentence {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 8px;
    }

    .card-footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Action Buttons */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .btn-action {
      padding: 14px 8px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      color: #fff;
    }

    .btn-again { background: var(--btn-again); }
    .btn-learning { background: var(--btn-learn); }
    .btn-know { background: var(--btn-know); }

    .nav-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Directory View */
    .directory-view {
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 500px;
      overflow-y: auto;
    }

    .directory-item {
      background: var(--surface-color);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--surface-color);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">FlashGerman</div>
      <div class="profile-controls">
        <select id="profileSelect" onchange="switchProfile(this.value)"></select>
        <button onclick="openProfileModal()">⚙️</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tabPractice" onclick="setTab('practice')">Practice</button>
      <button class="tab-btn" id="tabDirectory" onclick="setTab('directory')">Word Directory</button>
    </div>

    <div id="practiceView">
      <div class="stats-bar">
        <span>Queue: <strong id="queueCount">0</strong> remaining</span>
        <span>Known: <strong id="knownCount" style="color:var(--btn-know)">0</strong></span>
      </div>

      <div class="flashcard-container">
        <div class="flashcard" id="card" onclick="flipCard()">
          <!-- Front Face -->
          <div class="card-face card-front">
            <div class="card-header">
              <span class="badge" id="cardRank">Rank #1</span>
              <span class="badge badge-level" id="cardLevel">A1-B1</span>
            </div>
            <div class="card-body">
              <div class="word-row">
                <span class="word-main" id="frontWord">...</span>
                <button class="audio-btn" onclick="event.stopPropagation(); speakCurrentWord()">🔊</button>
              </div>
            </div>
            <div class="card-footer">Tap to flip 🔄</div>
          </div>

          <!-- Back Face -->
          <div class="card-face card-back">
            <div class="card-header">
              <span class="badge" id="backRank">Rank #1</span>
              <span class="badge badge-level" id="backLevel">A1-B1</span>
            </div>
            <div class="card-body">
              <div class="translation" id="backTranslation">...</div>
              <div class="example-sentence" id="backExample">...</div>
            </div>
            <div class="card-footer">Select status below</div>
          </div>
        </div>
      </div>

      <div class="action-grid">
        <button class="btn-action btn-again" onclick="rateCard('again')">Again</button>
        <button class="btn-action btn-learning" onclick="rateCard('learning')">Learning</button>
        <button class="btn-action btn-know" onclick="rateCard('know')">Know</button>
      </div>

      <div class="nav-controls" style="margin-top: 10px;">
        <button onclick="prevCard()">&leftarrow; Previous Card</button>
        <button onclick="nextCard()">Next Card &rightarrow;</button>
      </div>
    </div>

    <!-- Word Directory View -->
    <div id="directoryView" class="directory-view">
      <input type="text" id="dirSearch" placeholder="Search words..." oninput="renderDirectory()" style="padding:10px; width:100%; margin-bottom:8px;">
      <div id="directoryList"></div>
    </div>
  </div>

  <!-- Profile Manager Modal -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal">
      <h3>Manage Profiles</h3>
      <input type="text" id="newProfileName" placeholder="New Profile Name">
      <button onclick="createProfile()">Add Profile</button>
      <button onclick="resetCurrentProfileProgress()" style="background:var(--btn-again);">Reset Progress</button>
      <button onclick="closeProfileModal()">Close</button>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://raw.githubusercontent.com/ciolanigor-spec/FlashGerman/main/german_vocabulary_top20000.csv';

    let vocabulary = [];
    let activeQueue = [];
    let currentIndex = 0;
    let profiles = JSON.parse(localStorage.getItem('fg_profiles')) || ['Profile 1'];
    let currentProfile = localStorage.getItem('fg_current_profile') || 'Profile 1';
    let userProgress = {}; // key: Wort, value: 'again' | 'learning' | 'know'

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      loadProfiles();
      loadUserProgress();
      fetchVocabulary();
    });

    function fetchVocabulary() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          vocabulary = results.data;
          buildQueue();
          renderCard();
        }
      });
    }

    function loadProfiles() {
      const select = document.getElementById('profileSelect');
      select.innerHTML = '';
      profiles.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        if (p === currentProfile) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchProfile(name) {
      currentProfile = name;
      localStorage.setItem('fg_current_profile', name);
      loadUserProgress();
      buildQueue();
      currentIndex = 0;
      renderCard();
    }

    function loadUserProgress() {
      const data = localStorage.getItem(`fg_progress_${currentProfile}`);
      userProgress = data ? JSON.parse(data) : {};
    }

    function saveUserProgress() {
      localStorage.setItem(`fg_progress_${currentProfile}`, JSON.stringify(userProgress));
    }

    function buildQueue() {
      // Exclude 'know' words from active review queue
      activeQueue = vocabulary.filter(item => userProgress[item.Wort] !== 'know');
      updateStats();
    }

    function updateStats() {
      document.getElementById('queueCount').textContent = activeQueue.length;
      const known = Object.values(userProgress).filter(v => v === 'know').length;
      document.getElementById('knownCount').textContent = known;
    }

    function renderCard() {
      const cardEl = document.getElementById('card');
      cardEl.classList.remove('flipped');

      if (activeQueue.length === 0) {
        document.getElementById('frontWord').textContent = "All Done! 🎉";
        document.getElementById('cardRank').textContent = "-";
        return;
      }

      if (currentIndex >= activeQueue.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = activeQueue.length - 1;

      const word = activeQueue[currentIndex];
      document.getElementById('frontWord').textContent = word.Wort || word.word;
      document.getElementById('cardRank').textContent = `Rank #${word.Rank || (currentIndex + 1)}`;
      document.getElementById('cardLevel').textContent = word.Level || 'A1-B1';

      document.getElementById('backTranslation').textContent = word.Translation || word.translation;
      document.getElementById('backExample').textContent = word.Example || '';
      document.getElementById('backRank').textContent = `Rank #${word.Rank || (currentIndex + 1)}`;
      document.getElementById('backLevel').textContent = word.Level || 'A1-B1';
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function rateCard(status) {
      if (activeQueue.length === 0) return;
      
      const currentWord = activeQueue[currentIndex].Wort;
      userProgress[currentWord] = status;
      saveUserProgress();

      if (status === 'know') {
        activeQueue.splice(currentIndex, 1);
      } else {
        currentIndex++;
      }

      updateStats();
      renderCard();
    }

    function nextCard() {
      currentIndex++;
      renderCard();
    }

    function prevCard() {
      currentIndex--;
      renderCard();
    }

    function speakCurrentWord() {
      if (activeQueue.length === 0) return;
      const text = activeQueue[currentIndex].Wort;
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE';
      utterance.rate = 0.9;

      const voices = window.speechSynthesis.getVoices();
      const germanVoice = voices.find(v => v.lang.startsWith('de'));
      if (germanVoice) utterance.voice = germanVoice;

      window.speechSynthesis.speak(utterance);
    }

    /* Navigation Tabs */
    function setTab(tab) {
      document.getElementById('tabPractice').classList.toggle('active', tab === 'practice');
      document.getElementById('tabDirectory').classList.toggle('active', tab === 'directory');
      
      document.getElementById('practiceView').style.display = tab === 'practice' ? 'block' : 'none';
      document.getElementById('directoryView').style.display = tab === 'directory' ? 'flex' : 'none';

      if (tab === 'directory') renderDirectory();
    }

    function renderDirectory() {
      const filter = document.getElementById('dirSearch').value.toLowerCase();
      const container = document.getElementById('directoryList');
      container.innerHTML = '';

      vocabulary
        .filter(item => (item.Wort || '').toLowerCase().includes(filter))
        .slice(0, 50)
        .forEach(item => {
          const status = userProgress[item.Wort] || 'unseen';
          const div = document.createElement('div');
          div.className = 'directory-item';
          div.innerHTML = `
            <div>
              <strong>${item.Wort}</strong> <small>(${item.Translation})</small>
            </div>
            <span class="badge">${status}</span>
          `;
          container.appendChild(div);
        });
    }

    /* Profile Modal Logic */
    function openProfileModal() { document.getElementById('profileModal').style.display = 'flex'; }
    function closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; }

    function createProfile() {
      const name = document.getElementById('newProfileName').value.trim();
      if (name && !profiles.includes(name)) {
        profiles.push(name);
        localStorage.setItem('fg_profiles', JSON.stringify(profiles));
        loadProfiles();
        switchProfile(name);
        closeProfileModal();
      }
    }

    function resetCurrentProfileProgress() {
      if (confirm(`Reset all progress for ${currentProfile}?`)) {
        userProgress = {};
        saveUserProgress();
        buildQueue();
        renderCard();
        closeProfileModal();
      }
    }
  </script>
</body>
</html>
